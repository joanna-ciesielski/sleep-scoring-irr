[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rater-agreement"
version = "0.1.0"
description = "Chance-corrected agreement statistics for any raters, human or model — kappa, weighted kappa, Fleiss, Krippendorff's alpha, ICC, intra-rater reliability, kappa-paradox diagnostics, with bootstrap CIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joanna Ciesielski" }]
keywords = ["inter-rater-reliability", "intra-rater-reliability", "kappa", "kappa-paradox", "krippendorff", "icc", "agreement", "llm-as-judge", "evaluation"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
irr-demo = "irr.demo:main"

[tool.setuptools]
packages = ["irr", "raters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
