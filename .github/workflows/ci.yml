name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the demo
        run: python -m raters.demo --epochs 120 --raters 3 --seed 2
      - name: Smoke-test the worked examples
        run: |
          python examples/sleep_scoring.py --epochs 80 --raters 2
          python examples/llm_judges.py --items 200 --seed 3
          python examples/judge_stability.py --items 40 --repeats 10
